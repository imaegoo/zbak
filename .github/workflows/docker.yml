name: Docker

# 触发条件：创建 GitHub Release 时
on:
  release:
    types: [published]

jobs:
  docker:
    name: Build and Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    
    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 提取版本号和镜像标签
      - name: Extract metadata
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAGS<<EOF" >> $GITHUB_OUTPUT
          echo "${{ github.repository }}:$VERSION" >> $GITHUB_OUTPUT
          echo "${{ github.repository }}:latest" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      # 设置 QEMU（用于跨平台构建）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      # 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # 登录 Docker Hub（使用 GitHub Secrets）
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # 构建并推送多架构镜像
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/386,linux/amd64,linux/arm64/v8,linux/arm/v7
          push: true
          tags: |
            ${{ github.repository }}:${{ steps.meta.outputs.VERSION }}
            ${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
