name: Release

# 触发条件：创建 GitHub Release 时
on:
  release:
    types: [published]

# 声明所需权限
permissions:
  contents: write  # 需要写入权限以上传 Release Assets

jobs:
  build:
    name: Build Multi-Platform Binaries
    runs-on: ubuntu-latest
    
    # 构建矩阵：5 个平台配置
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: zbak-windows-amd64.exe
          - goos: linux
            goarch: amd64
            output: zbak-linux-amd64
          - goos: linux
            goarch: arm
            output: zbak-linux-arm
          - goos: darwin
            goarch: amd64
            output: zbak-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: zbak-darwin-arm64
    
    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 设置 Go 环境（1.25.0 或更高版本）
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.25.0'
          cache: true  # 启用 Go 模块缓存
      
      # 下载依赖
      - name: Download dependencies
        run: go mod download
      
      # 提取版本号（从 Git tag）
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      # 跨平台编译，注入版本信息
      - name: Build binary for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-X main.version=${{ steps.version.outputs.VERSION }}" \
            -o ${{ matrix.output }} ./cmd/zbak
      
      # 上传 Release Assets
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./${{ matrix.output }}
          asset_name: ${{ matrix.output }}
          asset_content_type: application/octet-stream
