name: CI

# 触发条件：push 到 main 分支或针对 main 分支的 pull request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 设置 Go 环境（1.25.0 或更高版本）
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.25.0'
          cache: true  # 启用 Go 模块缓存
      
      # 下载依赖
      - name: Download dependencies
        run: go mod download
      
      # 运行所有测试
      - name: Run tests
        run: go test ./...
      
      # 编译项目
      - name: Build binary
        run: go build ./cmd/zbak
